version: '{build}'
image: Ubuntu2204
build: off

# 只同步已完成清单的提交不必触发构建(否则每入库一条就多排一个构建)
skip_commits:
  files:
    - done.json

environment:
  PROXY_ONLY: "1"
  # 单 job 官方上限 60 分钟, 超时整批产物丢失; 预算 40 分钟给安装+上传留余量
  BUDGET: "2400"
clone_depth: 1
shallow_clone: true

install:
  - sudo apt-get update -qq
  - sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-chi-sim
  # opencv 必须钉 4.x: 5.x 移除了 CascadeClassifier, 人脸检测会静默失效(口播博主全漏)
  - python3 -m pip install -U --quiet yt-dlp bgutil-ytdlp-pot-provider pillow
  - python3 -m pip install --quiet opencv-python-headless==4.11.0.86
  - git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bg
  - (cd /tmp/bg/server && npm ci --ignore-scripts && npx tsc)
  - mkdir -p $HOME/bgutil-ytdlp-pot-provider && cp -a /tmp/bg/server/. $HOME/bgutil-ytdlp-pot-provider/

build_script:
  - python3 ci/fetch.py
  # 主通道: 上传到 GitHub Releases(无下载配额); 没配 GH_TOKEN 时自动跳过走 artifacts 兜底
  - python3 ci/upload_release.py || echo "release 上传失败, 走 artifacts 兜底"

artifacts:
  - path: out\*
    name: media
  - path: qc\*
    name: qc
  - path: report.json
    name: report
