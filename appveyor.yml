version: '{build}'
image: Ubuntu2204
build: off

# 只同步已完成清单的提交不必触发构建(否则每入库一条就多排一个构建)
skip_commits:
  files:
    - done.json

environment:
  PROXY_ONLY: "1"
clone_depth: 1
shallow_clone: true

install:
  - sudo apt-get update -qq
  - sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-chi-sim
  - python3 -m pip install -U --quiet yt-dlp bgutil-ytdlp-pot-provider pillow
  - git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bg
  - (cd /tmp/bg/server && npm ci --ignore-scripts && npx tsc)
  - mkdir -p $HOME/bgutil-ytdlp-pot-provider && cp -a /tmp/bg/server/. $HOME/bgutil-ytdlp-pot-provider/

build_script:
  - python3 ci/fetch.py

artifacts:
  - path: out\*
    name: media
  - path: qc\*
    name: qc
  - path: report.json
    name: report
